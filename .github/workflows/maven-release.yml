name: Maven release review

# Builds every native binary, assembles the Maven artifacts into a staging repository, tests
# that staging repository from a clean project on every platform, and only then (from a v*
# tag, with publish enabled and maven-release environment approval) signs and publishes the
# same commit to Maven Central as one atomic deployment. Central releases are immutable.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Maven Central (requires a matching version tag and maven-release environment approval)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/build-native.yml
    with:
      package: maven

  package:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          node: true
          java: true
      - uses: actions/download-artifact@v4
        with:
          pattern: maven-native-*
          path: maven/dowsing-rod-native/native
          merge-multiple: true
      - name: Check staged native binaries and checksums
        run: |
          for classifier in linux-x86_64 linux-aarch_64 linux-x86_64-musl linux-aarch_64-musl osx-x86_64 osx-aarch_64; do
            test -f "maven/dowsing-rod-native/native/$classifier/native/$classifier/dowsing-rod"
            test -f "maven/dowsing-rod-native/native/checksums/$classifier.sha256"
          done
          test -f maven/dowsing-rod-native/native/windows-x86_64/native/windows-x86_64/dowsing-rod.exe
          test -f maven/dowsing-rod-native/native/checksums/windows-x86_64.sha256
      - run: node scripts/version.mjs --maven-config
      - name: Build, test, and stage into a local repository
        working-directory: maven
        run: sh mvnw -B -ntp deploy -Ddowsing.requireNative=true "-DaltDeploymentRepository=staging::file://$GITHUB_WORKSPACE/dist/maven-staging"
      - name: Check every artifact is staged
        run: |
          VERSION="$(node scripts/version.mjs)"
          BASE="dist/maven-staging/io/github/38e9b0f8"
          test -f "$BASE/dowsing-rod-parent/$VERSION/dowsing-rod-parent-$VERSION.pom"
          test -f "$BASE/dowsing-rod-java/$VERSION/dowsing-rod-java-$VERSION.jar"
          test -f "$BASE/dowsing-rod-maven-plugin/$VERSION/dowsing-rod-maven-plugin-$VERSION.jar"
          test "$(ls "$BASE/dowsing-rod-native/$VERSION/"dowsing-rod-native-"$VERSION"-*.jar | wc -l)" -eq 7
          ! grep -rl '${revision}' "$BASE" --include='*.pom'
      - uses: actions/upload-artifact@v4
        with:
          name: maven-staging
          path: dist/maven-staging
          if-no-files-found: error

  test-installed:
    name: Test staged release (${{ matrix.name }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          # Java 8 is the floor; Temurin has no Java 8 build for Apple Silicon, so 11 there.
          - { name: linux-x64, runner: ubuntu-latest, java: '8' }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, java: '8' }
          - { name: macos-arm64, runner: macos-latest, java: '11' }
          - { name: macos-x64, runner: macos-15-intel, java: '8' }
          - { name: windows-x64, runner: windows-latest, java: '8' }
          - { name: alpine-x64, runner: ubuntu-latest, alpine: true }
          - { name: alpine-arm64, runner: ubuntu-24.04-arm, alpine: true }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          node: true
          java: ${{ matrix.alpine && 'false' || matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: maven-staging
          path: dist/maven-staging
      - name: Resolve and run the staged plugin from a clean project
        if: ${{ !matrix.alpine }}
        run: node scripts/test-maven-release.mjs dist/maven-staging
      - name: Resolve and run the staged plugin on Alpine
        if: matrix.alpine
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work eclipse-temurin:21-jdk-alpine \
            sh -c 'apk add --no-cache nodejs > /dev/null && node scripts/test-maven-release.mjs dist/maven-staging'

  publish:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v')
    needs: test-installed
    runs-on: ubuntu-latest
    environment: maven-release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          node: true
          maven-central: true
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs --check-tag "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          pattern: maven-native-*
          path: maven/dowsing-rod-native/native
          merge-multiple: true
      - run: node scripts/version.mjs --maven-config
      # The same commit and binaries as the tested staging repository; outputs are reproducible
      # (project.build.outputTimestamp), and this step adds signatures, sources, and javadoc.
      - name: Sign and publish to Maven Central
        working-directory: maven
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: sh mvnw -B -ntp deploy -P release -DskipTests -Dinvoker.skip=true
